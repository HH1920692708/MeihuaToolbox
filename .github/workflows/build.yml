name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # arm64 托管机常排不上队；Intel 机同样装有 Xcode 26.6 / iOS 26.5 SDK
    runs-on: macos-26-intel
    timeout-minutes: 40
    env:
      XCODEGEN_VERSION: "2.46.0"
      # 2.46.0 xcodegen.zip，本地下载后 Get-FileHash 复算
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen (pinned + checksum)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Core unit tests (macOS host)
        working-directory: Packages/MeihuaCore
        run: swift test

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project MeihuaToolbox.xcodeproj \
            -scheme MeihuaToolbox \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/MeihuaToolbox.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          lipo -info "$APP/MeihuaToolbox"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "../MeihuaToolbox-${GITHUB_SHA::7}.ipa" Payload)
          ls -l MeihuaToolbox-*.ipa

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MeihuaToolbox-ipa
          path: MeihuaToolbox-*.ipa
          if-no-files-found: error